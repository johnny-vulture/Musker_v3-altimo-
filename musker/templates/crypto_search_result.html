<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Crypto Details</title>
  </head>
  <body>
    {% if error_message %}
    <p>{{ error_message }}</p>
    {% else %}
    <div class="container">
      <h2>Crypto Details</h2>
      <p>Coin ID: {{ crypto_details.coin_id }}</p>
      <p>Symbol: {{ crypto_details.symbol }}</p>
      <p>Market Cap Rank: {{ crypto_details.market_cap }}</p>
      <img
        src="{{ crypto_details.image }}"
        alt="{{ crypto_details.symbol }} logo"
      />
    </div>
    <div>
      <form
        action="{% url 'add_to_portfolio' %}"
        method="post"
        class="d-inline-block"
      >
        {% csrf_token %}
        <input
          type="hidden"
          name="coin_id"
          value="{{ crypto_details.coin_id }}"
        />
        <label for="quantity" class="mr-2 font-weight-bold text-uppercase"
          >Units Owned</label
        >
        <input
          type="number"
          id="quantity"
          name="quantity"
          min="1"
          max="500"
          value="1"
          class="form-control d-inline-block w-auto mr-2 mb-2"
          required
        /><br />
        <button type="submit" class="btn btn-primary text-uppercase">
          Add to Portfolio
        </button>
      </form>
    </div>
    {% endif %}
  </body>
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4"
    crossorigin="anonymous"
  ></script>
</html>
