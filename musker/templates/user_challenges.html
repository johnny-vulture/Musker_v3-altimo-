<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>User Challenges</title>
  </head>
  <body>
    <h1>User Challenges</h1>
    {% if challenges %}
    <ul>
      {% for challenge in challenges %}
      <li>
        Challenge ID: {{ challenge.id }} - {{ challenge.sender.username }}
        challenged you {{challenge.match_date}}

        <form
          method="post"
          action="{% url 'accept_challenge' challenge.id %}"
          style="display: inline"
        >
          {% csrf_token %}
          <input type="submit" value="Accept" />
        </form>
        <form
          method="post"
          action="{% url "reject_challenge" challenge.id %}"
          style="display: inline"
        >
          {% csrf_token %}
          <input type="submit" value="Reject" />
        </form>
      </li>
      {% endfor %}
    </ul>
    {% else %}
    <p>No challenges found.</p>
    {% endif %}
  </body>
</html>
